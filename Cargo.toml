[package]
name = "owl"
version = "0.2.2"
edition = "2021"
rust-version = "1.85"
description = "Owl — 高性能、语言无关的进程管理器 (Rust 版 PM2)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "owl"
path = "src/main.rs"

[dependencies]
# 异步运行时：精简 features（不用 full）；daemon 用 current_thread 单线程运行时
tokio = { version = "1", features = [
    "rt",
    "net",
    "process",
    "io-util",
    "time",
    "signal",
    "sync",
    "macros",
    "fs",
] }
# CLI 参数解析
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
# IPC 消息序列化 / state.json 持久化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# owl.toml 配置解析（Phase 2 起用，先引入）
toml = "0.8"
# 终端彩色输出 + 表格渲染
colored = "2"
tabled = { version = "0.17", features = ["derive", "ansi"] }
# 时间戳格式化（存储用 epoch，显示时格式化）
chrono = { version = "0.4", features = ["serde"] }
# ~/.owl 路径
dirs = "5"
# 进程指标 / 启动时间（targeted refresh），跨平台兜底
sysinfo = "0.33"
# 统一错误类型
thiserror = "2"
anyhow = "1"
# Daemon 自身日志（自家生态）
owl-logger = "0.2.3"
axum = { version = "0.8", features = ["ws", "json"] }
flate2 = "1"
ratatui = "0.29.0"
crossterm = "0.29.0"

[target.'cfg(unix)'.dependencies]
# Unix 信号 / setsid / flock
nix = { version = "0.29", features = ["signal", "process", "fs"] }
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
